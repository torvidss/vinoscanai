<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VinoScan AI | Sommelier Privado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Shim robusto para evitar erro de 'process is not defined'
        window.process = { env: { API_KEY: "" } };
        
        // Capturador de erros para diagnóstico na tela preta
        window.onerror = function(msg, url, line, col, error) {
            console.error("Erro Crítico Detectado:", msg, error);
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = `
                    <div style="background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; font-family: sans-serif; text-align: center;">
                        <h1 style="color: #5C0A0A;">Falha na Inicialização</h1>
                        <p style="opacity: 0.6;">Ocorreu um erro ao carregar os módulos do sistema.</p>
                        <code style="background: #111; padding: 10px; border-radius: 5px; font-size: 12px; max-width: 100%; overflow-x: auto;">${msg}</code>
                        <button onclick="location.reload()" style="margin-top: 20px; background: #5C0A0A; color: white; border: none; padding: 10px 20px; border-radius: 5px;">Recarregar App</button>
                    </div>
                `;
            }
            return false;
        };
    </script>
    <style>
        :root {
            --burgundy: #5C0A0A;
            --gold: #E6C200;
            --bg-color: #050505;
            --text-primary: #f5f5f5;
            --text-secondary: rgba(255, 255, 255, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .light-mode {
            --bg-color: #FDFCFB;
            --text-primary: #1A1A1A;
            --text-secondary: rgba(0, 0, 0, 0.4);
            --glass-bg: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .serif { font-family: 'Playfair Display', serif; }
        .bg-burgundy { background-color: var(--burgundy); }
        .text-burgundy { color: var(--burgundy); }
        .text-gold { color: var(--gold); }
        
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1",
    "express": "https://esm.sh/express@^5.2.1",
    "stripe": "https://esm.sh/stripe@^20.1.2",
    "dotenv": "https://esm.sh/dotenv@^17.2.3"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
