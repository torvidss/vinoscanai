<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VinoScan AI | Sommelier Privado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Inicialização segura do ambiente
        window.process = window.process || { env: { API_KEY: "" } };
        
        // Diagnóstico de Produção: Captura erros antes do React montar
        window.onerror = function(msg, url, line, col, error) {
            console.error("ERRO CRÍTICO NO DEPLOY:", {msg, url, line, col, error});
            const root = document.getElementById('root');
            if (root && (root.innerHTML === "" || root.innerHTML.includes('Iniciando'))) {
                root.innerHTML = `
                    <div style="background: #050505; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; font-family: 'Inter', sans-serif; text-align: center;">
                        <div style="background: #5C0A0A; padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                             <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        </div>
                        <h1 style="font-size: 24px; margin-bottom: 10px; font-family: 'Playfair Display', serif;">Erro de Carregamento</h1>
                        <p style="opacity: 0.5; font-size: 14px; margin-bottom: 30px;">Não foi possível iniciar os módulos da aplicação no servidor atual.</p>
                        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; font-family: monospace; font-size: 11px; text-align: left; max-width: 100%; overflow-x: auto; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1);">
                            ${msg}<br>@ ${line}:${col}
                        </div>
                        <button onclick="location.reload()" style="background: #fff; color: #000; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Tentar Novamente</button>
                    </div>
                `;
            }
            return false;
        };
    </script>
    <style>
        :root {
            --burgundy: #5C0A0A;
            --gold: #E6C200;
            --bg-color: #050505;
            --text-primary: #f5f5f5;
            --text-secondary: rgba(255, 255, 255, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .light-mode {
            --bg-color: #FDFCFB;
            --text-primary: #1A1A1A;
            --text-secondary: rgba(0, 0, 0, 0.4);
            --glass-bg: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            margin: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .serif { font-family: 'Playfair Display', serif; }
        .bg-burgundy { background-color: var(--burgundy); }
        .text-burgundy { color: var(--burgundy); }
        .text-gold { color: var(--gold); }
        
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Garantir que o root ocupe toda a tela para evitar flash de cor */
        #root { min-height: 100vh; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1"
  }
}
</script>
</head>
<body>
    <div id="root">
        <!-- Loader inicial para evitar tela preta absoluta durante o download dos módulos -->
        <div style="background: #050505; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
            <div style="width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.05); border-top-color: #5C0A0A; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
